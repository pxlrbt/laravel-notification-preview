name: Format Code

on:
  push:
    paths:
      - '**.php'
      - 'pint.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # only the formatting job writes

jobs:
  php-code-styling:
    name: pint
    runs-on: ubuntu-latest

    permissions:
      contents: write # pushes the reformatted code back to the branch

    steps:
      # The credentials have to persist: git-auto-commit-action pushes with them.
      - name: Checkout code # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: Run Pint
        uses: aglipanci/laravel-pint-action@36de00d5f5a8a4e12d443e01671daa12a18f4c79 # 2.6

      # Handles the "nothing changed" case, which a raw git commit does not.
      - name: Commit changes # zizmor: ignore[superfluous-actions]
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.0.0
        with:
          commit_message: Code style
